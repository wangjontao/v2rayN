name: Build JLive Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - jlive-custom

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      OUTPUT_DIR: ${{ github.workspace }}\JLive-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx

      - name: Publish JLive
        shell: pwsh
        working-directory: ./v2rayN
        run: |
          dotnet publish ./v2rayN/v2rayN.csproj `
            -c Release `
            -r win-x64 `
            -p:SelfContained=true `
            -p:EnableWindowsTargeting=true `
            -o "$env:OUTPUT_DIR"

      - name: Publish AmazTool
        shell: pwsh
        working-directory: ./v2rayN
        run: |
          dotnet publish ./AmazTool/AmazTool.csproj `
            -c Release `
            -r win-x64 `
            -p:SelfContained=true `
            -p:PublishTrimmed=true `
            -p:EnableWindowsTargeting=true `
            -o "$env:OUTPUT_DIR"

      - name: Bundle all supported proxy cores
        shell: pwsh
        run: |
          $coreArchive = Join-Path $env:RUNNER_TEMP "v2rayN-windows-64-core.zip"
          $coreExtract = Join-Path $env:RUNNER_TEMP "v2rayN-windows-64-core"
          $coreUrl = "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/v2rayN-windows-64.zip"

          Invoke-WebRequest -Uri $coreUrl -OutFile $coreArchive
          Expand-Archive -Path $coreArchive -DestinationPath $coreExtract -Force

          $binSource = Get-ChildItem -Path $coreExtract -Directory -Recurse |
            Where-Object Name -eq "bin" |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1
          if (-not $binSource) {
            throw "The downloaded core package does not contain a bin directory."
          }

          $binTarget = Join-Path $env:OUTPUT_DIR "bin"
          New-Item -ItemType Directory -Path $binTarget -Force | Out-Null
          Copy-Item -Path (Join-Path $binSource.FullName "*") -Destination $binTarget -Recurse -Force

          # Xray 26.7.11 and later reject public VLESS without TLS. Keep the
          # last compatible core for existing JLive plain-VLESS profiles.
          $xrayVersion = "26.6.27"
          $xrayArchive = Join-Path $env:RUNNER_TEMP "Xray-windows-64-$xrayVersion.zip"
          $xrayExtract = Join-Path $env:RUNNER_TEMP "Xray-windows-64-$xrayVersion"
          $xrayUrl = "https://github.com/XTLS/Xray-core/releases/download/v$xrayVersion/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $xrayUrl -OutFile $xrayArchive
          Expand-Archive -Path $xrayArchive -DestinationPath $xrayExtract -Force
          Copy-Item -Path (Join-Path $xrayExtract "xray.exe") -Destination (Join-Path $binTarget "Xray\xray.exe") -Force

          $xrayVersionOutput = & (Join-Path $binTarget "Xray\xray.exe") version 2>&1 | Out-String
          if ($xrayVersionOutput -notmatch "Xray 26\.6\.27") {
            throw "Unexpected bundled Xray version: $xrayVersionOutput"
          }
          Write-Host $xrayVersionOutput

          $requiredCores = @(
            "bin\Xray\xray.exe",
            "bin\sing_box\sing-box.exe"
          )
          foreach ($core in $requiredCores) {
            $corePath = Join-Path $env:OUTPUT_DIR $core
            if (-not (Test-Path $corePath)) {
              throw "Required core is missing after packaging: $core"
            }
          }

          Write-Host "Bundled core directories:"
          Get-ChildItem -Path $binTarget -Directory | Select-Object -ExpandProperty Name

      - name: Remove debug symbols
        shell: pwsh
        run: Get-ChildItem -Path "$env:OUTPUT_DIR" -Filter *.pdb -Recurse | Remove-Item -Force

      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path "$env:OUTPUT_DIR\*" -DestinationPath "${{ github.workspace }}\JLive-windows-x64.zip" -Force

      - name: Upload JLive Windows x64
        uses: actions/upload-artifact@v7
        with:
          name: JLive-windows-x64
          path: JLive-windows-x64.zip
          if-no-files-found: error
